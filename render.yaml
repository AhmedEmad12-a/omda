services:
  - type: web
    name: omda-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run prisma:seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omda-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: omda-database
    plan: free
